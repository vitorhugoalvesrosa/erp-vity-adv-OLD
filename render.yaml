services:
  - type: web
    name: erp-vity
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && python manage.py setup_access_control && gunicorn erp_vity.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: erp-vity-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "true"

databases:
  - name: erp-vity-db
    databaseName: erp_vity
    user: erp_vity
    plan: free
