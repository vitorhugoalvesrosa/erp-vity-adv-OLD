<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Vity</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 40px;
            text-align: center;
            max-width: 600px;
        }
        h1 {
            margin-top: 0;
            color: #0f172a;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ERP Vity</h1>
        <p>Sistema em desenvolvimento com Django e Python no frontend.</p>
        <div class="badge">Aplicação rodando corretamente</div>
        <p>Usuário administrador padrão: <strong>admin</strong><br>Senha: <strong>administrador</strong></p>
    </div>
</body>
</html>
