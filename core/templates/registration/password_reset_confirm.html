<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escolher nova senha | ERP Vity</title>
</head>
<body>
    <main>
        {% if validlink %}
            <h1>Escolher nova senha</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Salvar nova senha</button>
            </form>
        {% else %}
            <h1>Link inválido ou expirado</h1>
            <p>Solicite uma nova redefinição de senha.</p>
            <a href="{% url 'admin_password_reset' %}">Solicitar novo link</a>
        {% endif %}
    </main>
</body>
</html>
